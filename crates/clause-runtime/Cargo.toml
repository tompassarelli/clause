[package]
name = "clause-runtime"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.96"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
clause-package = { path = "../clause-package" }
getrandom = { version = "=0.3.4", features = ["wasm_js"] }
sha2 = "=0.10.9"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.108"

[lints.rust]
unsafe_code = "forbid"
